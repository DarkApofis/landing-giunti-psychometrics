; PHP-FPM pool for the version B container (loaded after the image's www.conf, so these values win).
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Keep the platform's environment variables (APP_KEY, APP_URL, TRUSTED_PROXIES…) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
