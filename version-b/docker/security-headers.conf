# Security headers, included in the server block and in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location declares one).
# The page has no inline script or style (#app-config is a JSON data block, never executed) and loads
# everything from its own origin except the product photos. Scripts are 'self' only (the XSS defence);
# inline styles stay allowed because users' text-spacing / readability tools (bookmarklets, WCAG 1.4.12)
# work by injecting a <style>, and a style cannot run code.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
