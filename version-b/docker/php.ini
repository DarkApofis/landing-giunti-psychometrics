; Production PHP settings for the version B container.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 128M
max_execution_time = 30

; OPcache: compiled code stays in memory; files never change inside the image, so no revalidation.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
